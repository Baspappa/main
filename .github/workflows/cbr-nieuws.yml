name: CBR-nieuws bijwerken

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nieuws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Nieuws ophalen van cbr.nl
        run: node tools/cbr-nieuws.js
      - name: Wijzigingen committen
        run: |
          if git diff --quiet -- news.json; then
            echo "Niets te committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Nieuws bijgewerkt vanaf cbr.nl"
          git push
